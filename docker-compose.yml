# 游戏档案室 —— 静态站点容器
# 用法（在 NAS 上）：docker compose up -d
#
# 本文件是「容器内自行构建」的版本：git clone 到 NAS 后一条命令即可跑起来。
# NAS 的 CPU 较弱，构建会比较慢；更快的做法见 README「部署」章节的替代方案
# （本地 npm run build 后把 dist 同步到 NAS，只挂载不构建）。

name: game-wiki

services:
  web:
    build:
      context: .
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
    image: game-wiki:local
    container_name: game-wiki
    restart: unless-stopped
    ports:
      # 左侧是 NAS 对外端口，可改成任意未被占用的端口
      - "8080:80"
    environment:
      - TZ=Asia/Shanghai
